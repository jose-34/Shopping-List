<!DOCTYPE html>
<html>
  <head>
    <title>List</title>

    <style>
      body {
        background: pink;
        font-family: cursive;
        text-align: center;
        padding-top: 50px;
      
      }

      h1{
        color: #00796b;
        font-size: 40px;
      }

      ul, ol{
        list-style: none;
        padding: 0;
        font-size: 24px;
      }

      li{
        background: white;
        margin: 15px auto;
        padding: 15px;
        width: 300px;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      }
    </style>
  </head>

  <body>
     <h1>My shopping list</h1>
    <ul>
      
      <li>🥛Milk</li>
      <li>🍞Bread</li>
      <li>🍎Apple</li>
      <li>🧀Cheese</li>
      <li>🍪Cookies</li>
      <li>🍕pizza</li>
      
    </ul>

    <ol>
      
      <li>🥛Milk</li>
      <li>🍞Bread</li>
      <li>🍎Apple</li>
      <li>🧀Cheese</li>
      <li>🍪Cookies</li>
      <li>🍕pizza</li>
      
    </ol>
  </body>
</html>
